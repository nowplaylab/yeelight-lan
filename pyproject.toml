[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-lan"
version = "0.1.0"
description = "Yeelight over the home network: discovery, commands and music mode, plus a strip emulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.8"]
authors = [{name = "nowplaylab"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Framework :: AsyncIO"]

[project.urls]
Homepage = "https://github.com/nowplaylab/yeelight-lan"

[tool.setuptools]
packages = ["yeelight_lan"]
